name: Android debug build
description: >-
  The app's native Android debug APK for the emulator ABI (x86_64), at
  app/android/app/build/outputs/apk/debug/app-debug.apk. Used by CI's Android build and the
  manual app screenshot job. Expects the repo checked out, Node set up and `npm ci` done.

runs:
  using: composite
  steps:
    # AGP 9 needs JDK 17 or newer.
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    # Caches Gradle dependencies, the wrapper and the Gradle build cache
    # between runs. Only main writes the cache; other runs read it.
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Generate native project
      shell: bash
      run: npx expo prebuild --platform android --no-install --clean
      working-directory: app

    # One ABI (x86_64, the emulator ABI) instead of all four: the native
    # C++ build dominates the job time, and one ABI proves the build works.
    - name: Assemble debug APK
      shell: bash
      run: ./gradlew assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=x86_64
      working-directory: app/android
