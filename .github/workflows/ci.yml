name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: CDK synth (no AWS credentials needed)
        run: npm run synth

  android:
    # Native Android debug build. iOS native builds run on EAS (see README).
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - uses: ./.github/actions/android-debug-build

  club-data:
    # packages/club-data repository and authorization tests against DynamoDB Local.
    name: Club data (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: DynamoDB Local tests (club-data, then the API handlers on top)
        run: npm run test:db -w @huntclub/club-data -w @huntclub/api
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
