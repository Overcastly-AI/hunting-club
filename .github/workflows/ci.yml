name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  android:
    # Native Android debug build. iOS native builds run on EAS (see README).
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # AGP 9 needs JDK 17 or newer.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle dependencies and the wrapper between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Install
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install --clean
        working-directory: app

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android

  club-data:
    # packages/club-data repository and authorization tests against DynamoDB Local.
    name: Club data (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: DynamoDB Local tests
        run: npm run test:db -w @huntclub/club-data
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
