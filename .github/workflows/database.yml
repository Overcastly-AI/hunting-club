name: Database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/shared/**'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/shared/**'
      - '.github/workflows/database.yml'

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    # pgTAP has to be installed in the server itself, so this uses the runner's own
    # PostgreSQL instead of a postgres service container (whose image has no pgTAP).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start PostgreSQL 16 with pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo pg_ctlcluster 16 main start
          sudo -u postgres createuser --superuser "$USER"

      - name: Migrations and RLS tests (pgTAP)
        run: supabase/scripts/db.sh test

      - name: Generated database types are up to date
        run: |
          npm run gen:db-types -w @huntclub/shared
          git diff --exit-code -- packages/shared/src/database.types.ts
